<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Nasrudin">
  <title>Nasrudin</title>
  <!--
    Turnstile ⊢ — the formal-logic symbol for "derives".
    Reflects the site tagline: "derive physics from pure logic."
    The terracotta dot at the tip is the derived theorem (or a particle).
    Palette matches the site's manuscript / paper aesthetic:
      cream  #FBF7EF  ink  #2A211A  accent  #C8633B
  -->
  <rect width="32" height="32" rx="6" fill="#FBF7EF"/>
  <g stroke="#2A211A" stroke-width="3.2" stroke-linecap="round" fill="none">
    <line x1="9" y1="6"  x2="9"  y2="26"/>
    <line x1="9" y1="16" x2="22" y2="16"/>
  </g>
  <circle cx="23.5" cy="16" r="2.2" fill="#C8633B"/>
  <style>
    @media (prefers-color-scheme: dark) {
      rect { fill: #2A211A; }
      g    { stroke: #FBF7EF; }
    }
  </style>
</svg>
