[workspace]
members = [
    "crates/core",
    "crates/rocks",
    "crates/pg",
    "crates/lean-bridge",
    "crates/derive",
    "crates/ga",
    "crates/api",
    "crates/mcp",
    "crates/importer",
    "crates/embed",
    "crates/llm",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["unbounded_depth"] }
schemars = { version = "1", features = ["preserve_order"] }

# Async runtime
tokio = { version = "1.52", features = ["full"] }
tokio-stream = { version = "0.1", features = ["time", "sync"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Resource detection (for worker auto-sizing)
num_cpus = "1.17"
sysinfo = "0.38"

# Hashing & encoding
blake3 = "1.8"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
hex = "0.4"
data-encoding = "2"
bloomfilter = "3"
base64 = "0.22"

# Web framework
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.12", features = ["typed-header"] }
tower-sessions = { version = "0.15", features = ["memory-store"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "compression-br"] }
tower_governor = "0.8"
governor = "0.10"

# Authentication
password-auth = "1"

# Database - RocksDB (embedded theorem store)
rocksdb = { version = "0.24", features = ["multi-threaded-cf"] }

# Database - SeaORM 2 (PostgreSQL ORM for users/auth/workers)
sea-orm = { version = "2.0.0-rc.38", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-uuid",
    "with-chrono",
    "with-json",
] }
sea-orm-migration = { version = "2.0.0-rc.38", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
] }

# Common types
uuid = { version = "1.23", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.10"

# Env
dotenvy = "0.15"

# Protobuf
prost = "0.14"
bytes = "1.11"

# Embeddings (Phase B)
fastembed = { version = "5", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries"] }
instant-distance = { version = "0.6", features = ["with-serde"] }
memmap2 = "0.9"

# LLM router (Phase C)
aes-gcm = "0.11.0-rc.3"
rand_core = "0.10"
async-trait = "0.1"
futures = "0.3"

# Cluster steerer + paid Researcher (Phase D)
arc-swap = "1"
dashmap = "6"

# Cold-tier RocksDB encoding for the Mathlib corpus (~195k entries).
# rkyv: zero-copy reads via `Archive` derives on Axiom/Expr/Domain. lru
# caps the in-process working-set on top of the RocksDB block cache.
# postcard: serde-compat binary format for third-party types (HnswMap)
# that don't have rkyv impls.
rkyv = { version = "0.8", features = ["bytecheck"] }
postcard = { version = "1", features = ["alloc"] }
lru = "0.18"
