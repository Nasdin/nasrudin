[package]
name = "physics-api"
version.workspace = true
edition.workspace = true

[lib]
name = "physics_api"
path = "src/lib.rs"

[[bin]]
name = "physics-api"
path = "src/main.rs"

[[bin]]
name = "backfill_existing_lean"
path = "src/bin/backfill_existing_lean.rs"

[[bin]]
name = "cache-stats"
path = "src/bin/cache_stats.rs"

[[bin]]
name = "embed_build"
path = "src/bin/embed_build.rs"

[[bin]]
name = "issue_worker_key"
path = "src/bin/issue_worker_key.rs"

[dependencies]
nasrudin-core = { path = "../core" }
nasrudin-rocks = { path = "../rocks" }
nasrudin-pg = { path = "../pg" }
nasrudin-ga = { path = "../ga" }
nasrudin-derive = { path = "../derive" }
nasrudin-lean-bridge = { path = "../lean-bridge" }
nasrudin-embed = { path = "../embed" }
nasrudin-llm = { path = "../llm" }
sea-orm = { workspace = true }
axum = { workspace = true }
axum-extra = { workspace = true }
axum-login = { workspace = true }
tower-sessions = { workspace = true }
password-auth = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
async-stream = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tower_governor = { workspace = true }
xxhash-rust = { workspace = true }
governor = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
hmac = "0.12"
sha2 = "0.10"
dotenvy = { workspace = true }
data-encoding = { workspace = true }
rand = { workspace = true }
regex = "1"
walkdir = "2"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4", features = ["derive"] }
async-stripe = { version = "0.41", default-features = false, features = ["runtime-tokio-hyper-rustls", "checkout", "billing", "connect", "webhook-events"] }
rocksdb = { workspace = true }
tokio-util = { version = "0.7", features = ["io"] }
arc-swap = { workspace = true }
dashmap = { workspace = true }
async-trait = { workspace = true }
jsonwebtoken = "9"

[dev-dependencies]
tempfile = "3"
# rsa + rand 0.8 (matched pair) for JWT test fixtures. rand 0.9 (workspace
# default) breaks rsa's CryptoRngCore bound; pinning rand 0.8 just for the
# test target avoids dragging the conflict into the main code.
rsa = "0.9"
rand_08 = { package = "rand", version = "0.8" }
proptest = "1"
