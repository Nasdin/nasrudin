[package]
name = "physics-api"
version.workspace = true
edition.workspace = true

[lib]
name = "physics_api"
path = "src/lib.rs"

[[bin]]
name = "physics-api"
path = "src/main.rs"

[[bin]]
name = "backfill_existing_lean"
path = "src/bin/backfill_existing_lean.rs"

[[bin]]
name = "cache-stats"
path = "src/bin/cache_stats.rs"

[[bin]]
name = "embed_build"
path = "src/bin/embed_build.rs"

[[bin]]
name = "issue_worker_key"
path = "src/bin/issue_worker_key.rs"

[dependencies]
nasrudin-core = { path = "../core" }
nasrudin-rocks = { path = "../rocks" }
nasrudin-pg = { path = "../pg" }
nasrudin-ga = { path = "../ga" }
nasrudin-derive = { path = "../derive" }
nasrudin-lean-bridge = { path = "../lean-bridge" }
nasrudin-embed = { path = "../embed" }
nasrudin-llm = { path = "../llm" }
sea-orm = { workspace = true }
axum = { workspace = true }
axum-extra = { workspace = true }
tower-sessions = { workspace = true }
password-auth = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
async-stream = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tower_governor = { workspace = true }
xxhash-rust = { workspace = true }
governor = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
hmac = "0.12"
sha2 = "0.10"
dotenvy = { workspace = true }
data-encoding = { workspace = true }
rand = { workspace = true }
regex = "1"
walkdir = "2"
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
clap = { version = "4", features = ["derive"] }
# async-stripe 1.0 splits product surfaces into separate crates: the
# top-level `async-stripe` is just the HTTP client + builders; product
# types live in `async-stripe-core` (Customer), `async-stripe-checkout`
# (CheckoutSession), `async-stripe-billing` (BillingPortalSession),
# `async-stripe-webhook` (signature verification + event dispatch),
# `async-stripe-shared` (Subscription + status enums + ID types),
# `async-stripe-types` (Expandable + the basic primitives).
async-stripe = { version = "1.0.0-rc.5", default-features = false, features = ["rustls-tls-webpki-roots", "rustls-aws-lc-rs"] }
async-stripe-types = "1.0.0-rc.5"
async-stripe-shared = "1.0.0-rc.5"
async-stripe-core = { version = "1.0.0-rc.5", features = ["customer"] }
async-stripe-checkout = { version = "1.0.0-rc.5", features = ["checkout_session"] }
async-stripe-billing = { version = "1.0.0-rc.5", features = ["subscription", "billing_portal_session"] }
async-stripe-webhook = "1.0.0-rc.5"
rocksdb = { workspace = true }
tokio-util = { version = "0.7", features = ["io"] }
bytes = { workspace = true }
arc-swap = { workspace = true }
dashmap = { workspace = true }
async-trait = { workspace = true }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
lru = { workspace = true }

[dev-dependencies]
tempfile = "3"
# rsa + rand 0.8 (matched pair) for JWT test fixtures. rand 0.9 (workspace
# default) breaks rsa's CryptoRngCore bound; pinning rand 0.8 just for the
# test target avoids dragging the conflict into the main code.
rsa = "0.9"
rand_08 = { package = "rand", version = "0.8" }
proptest = "1"
