[package]
name = "nasrudin-rocks"
version.workspace = true
edition.workspace = true

[dependencies]
nasrudin-core = { path = "../core" }
rocksdb = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
# Cold-tier corpus encoding (Mathlib ~195k axioms). rkyv gives
# zero-copy reads on cache hits — the GA hot loop pays no decode cost
# for axioms the block cache already has.
rkyv = { workspace = true }
# Dynamic block-cache sizing — read total system RAM at DB open time.
sysinfo = { workspace = true }

[dev-dependencies]
tempfile = "3"
