[package]
name = "nasrudin-derive"
version.workspace = true
edition.workspace = true

[dependencies]
nasrudin-core = { path = "../core" }
nasrudin-rocks = { path = "../rocks" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_stacker = "0.1"
tracing = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true }
# AxiomStore cold-tier LRU around RocksDB lookups (~1k entries × ~5 KB
# avg = ~5 MB) so chain-engine's repeated `store.get(name)` doesn't
# round-trip through the block cache for hot axiom names.
lru = { workspace = true }

[dev-dependencies]
nasrudin-lean-bridge = { path = "../lean-bridge" }
serial_test = "3"
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "process", "io-util", "sync"] }
# M3 novelty-vs-catalog: verify the bloom prepopulation contract from
# the same crate the helper lives in. Worker (`nasrudin-ga`) uses the
# matching crate version for the runtime path.
bloomfilter = "3"
