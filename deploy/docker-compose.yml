services:
  postgres:
    image: postgres:18-alpine
    container_name: nasrudin-pg
    env_file: .env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - /data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: nasrudin-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /data/caddy:/data
      - /data/caddy-config:/config
    depends_on: [api, frontend]
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/api.Dockerfile
    container_name: nasrudin-api
    env_file: .env
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      ROCKS_DB_PATH: /data/rocks
      PROVER_ROOT: /opt/prover
      LAKE_WORKSPACE_ROOT: /data/lake-cache
      API_PORT: "3001"
    volumes:
      - /data/rocks:/data/rocks
      - /data/lake-cache:/data/lake-cache
      - ../prover:/opt/prover:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../nasrudin-frontend
      dockerfile: ../deploy/dockerfiles/frontend.Dockerfile
    container_name: nasrudin-frontend
    env_file: .env
    environment:
      VITE_API_URL: "https://api.nasrudin.org"
    restart: unless-stopped

  ga-worker:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/api.Dockerfile
      target: worker
    container_name: nasrudin-ga
    env_file: .env
    environment:
      NASRUDIN_API_URL: "http://api:3001"
      NASRUDIN_WORKER_KEY: "${NASRUDIN_INTERNAL_WORKER_KEY}"
      NASRUDIN_WORKER_ID: "in-proc-worker-1"
      PROVER_ROOT: /opt/prover
    volumes:
      - ../prover:/opt/prover:ro
    profiles: [workers]
    depends_on: [api]
    restart: unless-stopped

  backup:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/backup.Dockerfile
    container_name: nasrudin-backup
    env_file: .env
    volumes:
      - /data:/data:ro
      - ../deploy/rclone.conf:/etc/rclone.conf:ro
    restart: unless-stopped
